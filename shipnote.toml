# Shipnote の設定。Pages の LP (/projects/<slug>/) に出す内容。
# 書き換えたら `shipnote sync` で反映する。

name = "GlossPop"
github = "lancard-aikawa/GlossPop"
# slug = "glosspop"   # LP の URL。省略すると name から作る

# 一行の紹介 (トップの一覧と LP の見出し下に出る)
tagline = "選んだ言葉を AI が辞書化し、以後の表示で自動リンクと吹き出しにするビューア"

# 二〜四文の説明
description = "Markdown やテキストをブラウザで読みながら、知らない言葉を選ぶだけで辞書に登録できます。登録した語は以後の本文で自動的にリンクになり、ホバーで吹き出しが出て、そこから用語ページへ移動できます。読みや別名、カテゴリ、要約、本文は Claude Code CLI か Gemini API が下書きし、直してから保存します。AI が無くても手で登録して使えます。"

features = [
  "登録した語は本文で自動リンクになる。装飾やルビをまたいでも照合し、pre やコードの中は避ける",
  "選んだ語の読み・別名・カテゴリ・要約・本文を AI が下書きする。文書から辞書化する価値のある語をまとめて挙げさせることもできる",
  "解説の口調と語り手の顔を作品ごとに設定でき、吹き出しと用語ページに反映される",
  "用語どうしの関係を書くと図になる。一覧と 5 つの図が同じタブに並ぶ",
  "フォルダごとの辞書を持てる。初出の場面だけを AI に渡し、判明位置つきの関係は図でも伏せる",
]

# 動く環境 (例: "Windows 10 / 11")
platforms = "Windows（64bit）"

# リポジトリ内の画像のパス。LP に並ぶ
screenshots = ["docs/images/viewer-popup.png", "docs/images/graph.png"]

# false にするとトップの一覧から外す (LP とリリース記録は作る)
listed = true

# false にすると一覧と LP だけ載せ、リリース記録 (/posts/) は作らない (作ってあったものは消す)
posts = false
