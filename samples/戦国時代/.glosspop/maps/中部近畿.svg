<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- 中部・近畿の略図。**地名は書かない**（名前は辞書が持つ）。
       正確な地形ではなく「点と線を置く 1 枚の絵」として描いてある。 -->
  <rect width="1000" height="700" fill="#dcd8cc"/>

  <!-- 海（伊勢湾・大阪湾・日本海） -->
  <path d="M 1000 700 L 1000 380 L 880 430 L 800 470 L 760 560 L 700 640 L 660 700 Z" fill="#9fb8c8"/>
  <path d="M 0 700 L 0 600 L 120 620 L 200 660 L 240 700 Z" fill="#9fb8c8"/>
  <path d="M 0 0 L 0 120 L 180 90 L 340 60 L 460 30 L 520 0 Z" fill="#9fb8c8"/>

  <!-- 琵琶湖 -->
  <path d="M 372 190 C 400 210, 412 250, 400 292 C 392 330, 404 356, 396 386
           C 388 412, 356 420, 344 396 C 332 370, 348 336, 352 300
           C 356 262, 344 218, 372 190 Z" fill="#8fb0c4"/>

  <!-- 山地（濃い側から順に） -->
  <path d="M 430 120 L 520 60 L 620 130 L 700 90 L 780 160 L 700 210 L 560 200 L 460 180 Z"
        fill="#c3c0ae"/>
  <path d="M 140 240 L 240 180 L 320 250 L 260 320 L 160 310 Z" fill="#c3c0ae"/>
  <path d="M 470 420 L 560 370 L 660 430 L 620 500 L 500 490 Z" fill="#c9c6b5"/>
  <path d="M 180 430 L 260 390 L 330 450 L 280 520 L 190 500 Z" fill="#c9c6b5"/>

  <!-- 平野の縁（薄い線でうっすら） -->
  <path d="M 300 520 C 420 560, 560 570, 700 540" fill="none" stroke="#c0bcab" stroke-width="6"/>
  <path d="M 420 300 C 520 330, 640 350, 760 330" fill="none" stroke="#c0bcab" stroke-width="6"/>

  <!-- 主要な河川 -->
  <path d="M 396 386 C 380 440, 340 490, 300 540" fill="none" stroke="#9fb8c8" stroke-width="7"/>
  <path d="M 700 300 C 730 360, 760 420, 790 470" fill="none" stroke="#9fb8c8" stroke-width="7"/>
</svg>
