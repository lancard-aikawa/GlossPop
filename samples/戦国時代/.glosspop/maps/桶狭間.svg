<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- 桶狭間まわりの局地図（略図）。**地名は書かない**（名前は辞書が持つ）。
       進軍路の線は描かない —— 説ごとに違うので、辞書の関係から引く。 -->
  <rect width="1000" height="700" fill="#dcd8cc"/>

  <!-- 海（南の入り江） -->
  <path d="M 0 700 L 0 520 C 120 540, 220 580, 300 640 L 340 700 Z" fill="#9fb8c8"/>

  <!-- 丘陵（北の尾根） -->
  <path d="M 380 120 C 460 80, 560 100, 620 150 C 680 200, 660 250, 580 250
           C 500 250, 400 200, 380 120 Z" fill="#c3c0ae"/>
  <path d="M 120 180 C 190 140, 260 170, 280 230 C 296 280, 240 310, 180 290
           C 120 270, 100 220, 120 180 Z" fill="#c3c0ae"/>

  <!-- 窪地（南東の谷） -->
  <path d="M 590 480 C 660 440, 740 470, 760 530 C 776 586, 700 620, 630 600
           C 570 582, 550 512, 590 480 Z" fill="#c9c6b5"/>

  <!-- 谷筋 -->
  <path d="M 300 300 C 400 340, 500 380, 600 420" fill="none" stroke="#c0bcab" stroke-width="8"/>

  <!-- 街道 -->
  <path d="M 60 420 C 240 400, 420 440, 560 500 C 680 552, 820 560, 960 540"
        fill="none" stroke="#bfae92" stroke-width="10" stroke-dasharray="26 14"/>

  <!-- 小川 -->
  <path d="M 420 240 C 440 320, 420 400, 380 470 C 350 522, 320 570, 300 640"
        fill="none" stroke="#9fb8c8" stroke-width="6"/>
</svg>
