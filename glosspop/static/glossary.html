<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlossPop — 辞書</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
// 描画の前にテーマを当てる。あとから当てると、暗いテーマのとき一瞬白く光る。
// キー名は base.js の THEME_KEY と同じ
try {
  const t = localStorage.getItem("glosspop.theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (e) { /* 読めなければ OS の設定に従う */ }
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">Gloss<span>Pop</span></a>
  <nav class="topnav">
    <a href="/">ビューア</a>
    <a href="/glossary" aria-current="page">辞書</a>
    <a href="/graph">相関図</a>
  </nav>
  <span class="spacer"></span>
  <span class="meta" id="count"></span>
</div>

<!-- 中身は glossary.js が描く（ビューアに重ねるときと同じものを、同じ出どころから） -->
<div class="page">
  <div class="page-inner" id="page-root"></div>
</div>

<script type="module">
  import { mount } from "/static/glossary.js";
  mount(document.getElementById("page-root"), { search: location.search });
</script>
<script type="module" src="/static/settings.js"></script>
</body>
</html>
