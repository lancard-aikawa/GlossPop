[project]
name = "glosspop"
version = "0.16.1"
description = "選択したテキストを AI が辞書化し、以後の表示で自動リンク＋吹き出し表示するブラウザビューア"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pypdf>=6.21.1",
    # httpx が TLS の検証に使う CA の束。emSign の中間 CA を外した版を下限にする
    "certifi>=2026.10.19",
]

[project.scripts]
glosspop = "glosspop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.40",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glosspop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 全件は Chrome を何度も起動するぶんリニアに伸びる。日常の反復では外せるように
# 印を付けてある（`check.cmd fast` = `-m "not smoke"`）。**登録しないと
# `--strict-markers` の無い今でも警告になるので、印を足したらここにも足すこと。**
markers = [
    "smoke: ブラウザを立ち上げる通しテスト (tests/test_smoke_ui.py)",
]

[tool.uv]
# 待ち期間 (P7D) の例外。脆弱性の修正版が期間の内側に出たので、この 2 つだけ
# 日付で通している。ほかのパッケージは全体の P7D のまま。日付は過去に固定なので
# 期間が明けたあとも害は無いが、その次に上げるときに外してよい。
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", pypdf = "2026-10-22T00:00:00Z" }
